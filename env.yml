# env.yml — Snowflake-native dbt environment configuration
#
# Each environment defines the DBT_* variables that profiles.yml resolves at runtime.
# Switch environments at execution time:
#   snow dbt execute --env dev   PAYER_PROVIDER run   (developers)
#   snow dbt execute --env test  PAYER_PROVIDER run   (CI/CD on PR merge)
#   snow dbt execute --env prod  PAYER_PROVIDER run   (CI/CD after test passes)
#
# Naming conventions follow the guide ({ENV}_{OBJECT}_{SIZE/PRIVILEGE}):
#   Databases:  PROD_ANALYTICS / TEST_ANALYTICS / DEV_ANALYTICS  (transformation output)
#               PROD_RAW       / TEST_RAW       / DEV_RAW        (raw Oracle ingestion)
#   Warehouses: PROD_ANALYTICS_XS / TEST_ANALYTICS_XS / DEV_ANALYTICS_XS
#   Roles:      PROD_ANALYTICS_RW / TEST_ANALYTICS_RW / DEV_ANALYTICS_ADMIN
#
# Raw databases (PROD_RAW etc.) are zero-copy cloned from PROD_RAW nightly or on-demand.
# Source and target are different databases — DBT_SOURCE_DATABASE reads from *_RAW.
#
# Dev developer isolation: output schemas are user-prefixed inside DEV_ANALYTICS
#   e.g. COCO_STAGING, COCO_INTERMEDIATE, COCO_MARTS
#   RAW_ORACLE source schema is shared and never prefixed.

env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_CURRENT_ROLE: DEV_ANALYTICS_ADMIN
        DBT_DATABASE: DEV_ANALYTICS
        DBT_SOURCE_DATABASE: DEV_RAW
        DBT_WAREHOUSE: DEV_ANALYTICS_XS
        DBT_SCHEMA: DEFAULT
        # Output schemas prefixed with current user → COCO_STAGING, COCO_INTERMEDIATE, COCO_MARTS
        DBT_ENV_SCHEMA_PREFIX: "{{ select CURRENT_USER() }}"

    - name: test
      env:
        DBT_CURRENT_ROLE: TEST_ANALYTICS_RW
        DBT_DATABASE: TEST_ANALYTICS
        DBT_SOURCE_DATABASE: TEST_RAW
        DBT_WAREHOUSE: TEST_ANALYTICS_XS
        DBT_SCHEMA: DEFAULT

    - name: prod
      env:
        DBT_CURRENT_ROLE: PROD_ANALYTICS_RW
        DBT_DATABASE: PROD_ANALYTICS
        DBT_SOURCE_DATABASE: PROD_RAW
        DBT_WAREHOUSE: PROD_ANALYTICS_XS
        DBT_SCHEMA: DEFAULT
